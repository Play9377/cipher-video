<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>China- 中国核心数据访问</title>
    <style>
        :root {
            --primary-color: #00f2ff; /* 霓虹蓝 */
            --danger-color: #ff0055;
            --bg-dark: #0a0a0c;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg-dark); overflow: hidden; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }

        /* 背景流光动画 */
        .bg-effect {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
            z-index: -1;
        }

        /* 登录容器 */
        #auth-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; backdrop-filter: blur(10px);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
            text-align: center;
            transition: all 0.5s ease;
        }

        h2 { 
            text-transform: uppercase; letter-spacing: 3px; 
            color: var(--primary-color); margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        /* 协议区域优化 */
        .protocol-box {
            background: rgba(0,0,0,0.4);
            padding: 15px; border-radius: 8px;
            font-size: 13px; text-align: left;
            height: 180px; overflow-y: auto;
            color: #8892b0; border: 1px solid #333;
            margin-bottom: 20px; line-height: 1.6;
        }
        .protocol-box::-webkit-scrollbar { width: 4px; }
        .protocol-box::-webkit-scrollbar-thumb { background: #333; }

        /* 复选框样式 */
        .checkbox-wrapper { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; margin-bottom: 20px; cursor: pointer; }
        input[type="checkbox"] { accent-color: var(--primary-color); width: 18px; height: 18px; }

        /* 输入框优化 */
        input[type="password"] {
            width: 100%; padding: 12px; border: none; border-bottom: 2px solid #333;
            background: transparent; color: var(--primary-color);
            font-size: 20px; text-align: center; margin-bottom: 30px;
            outline: none; transition: border-color 0.3s;
        }
        input[type="password"]:focus { border-color: var(--primary-color); }

        /* 按钮美化 */
        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 8px;
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            color: white; font-weight: bold; text-transform: uppercase;
            cursor: pointer; box-shadow: 0 0 15px rgba(58, 123, 213, 0.4);
            transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(0, 242, 255, 0.6); }
        .btn:active { transform: translateY(0); }

        /* 视频容器 */
        video { width: 100%; height: 100%; background: #000; display: none; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="bg-effect"></div>

<div id="auth-container">
    <!-- 第一步：协议 -->
    <div class="glass-card" id="step1">
        <h2>China- 中国核心数据访问</h2>
        <div class="protocol-box">
            [ 系统通告 ]<br>
            访问此加密内容前，您必须遵守以下条款：<br><br>
            1. 严禁使用任何形式的抓包、镜像或插件工具试图提取媒体流。<br>
            2. 本内容仅供单人查看，不得在公共场合投屏播放。<br>
            3. 您理解本网页会检测页面活跃状态，一旦检测到录屏行为将立即熔断。<br>
            4. 即将违反国际日内瓦网络安全条款。<br>
            5. 点击同意即代表您自愿承担一切数据泄露后的法律后果。
        </div>
        <label class="checkbox-wrapper">
            <input type="checkbox" id="agree"> 我已获得授权并同意协议
        </label>
        <button class="btn" onclick="goToStep2()">继续访问</button>
    </div>

    <!-- 第二步：密码 -->
    <div class="glass-card" id="step2" style="display: none;">
        <h2>Identity Auth</h2>
        <p style="color: #666; font-size: 12px;">请输入解密密钥</p>
        <input type="password" id="passcode" maxlength="6" autocomplete="off" placeholder="••••••">
        <button class="btn" onclick="startSystem()">解锁加密流</button>
    </div>
</div>

<video id="mainVideo" 
       controlsList="nodownload noremoteplayback" 
       disablePictureInPicture 
       oncontextmenu="return false;">
    <source src="right.mp4" type="video/mp4">
</video>

<script>
    const video = document.getElementById('mainVideo');

    function goToStep2() {
        if (!document.getElementById('agree').checked) {
            alert("⚠️ 必须接受安全协议才能继续");
            return;
        }
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
    }

    function startSystem() {
        const pwd = document.getElementById('passcode').value;
        if (pwd === "865744") {
            // 隐藏验证层
            document.getElementById('auth-container').style.display = 'none';
            video.style.display = 'block';
            
            // 触发全屏
            if (video.requestFullscreen) video.requestFullscreen();
            else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();

            // 尝试播放
            video.play().catch(() => {
                // 若被浏览器策略拦截，静音播放
                video.muted = true;
                video.play();
            });
        } else {
            alert("❌ 授权码无效。访问请求已被记录。");
            document.getElementById('passcode').value = '';
        }
    }

    // 禁用快捷键保存 (Ctrl+S, Ctrl+U)
    document.addEventListener('keydown', e => {
        if ((e.ctrlKey && (e.keyCode === 83 || e.keyCode === 85)) || e.keyCode === 123) {
            e.preventDefault();
            return false;
        }
    });
</script>

</body>
</html>
